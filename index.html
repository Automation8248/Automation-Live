<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Web Browser</title>
    <style>
        /* Modern Dark Mode UI */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #202124; color: #fff; overflow: hidden; }
        
        /* Tab Bar */
        #tab-bar { display: flex; background-color: #171717; padding: 8px 8px 0 8px; gap: 5px; align-items: flex-end; overflow-x: auto; }
        #tab-bar::-webkit-scrollbar { height: 4px; }
        #tab-bar::-webkit-scrollbar-thumb { background: #555; }
        
        .tab { background-color: #292a2d; color: #9aa0a6; padding: 8px 15px; border-radius: 8px 8px 0 0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-width: 150px; max-width: 220px; font-size: 13px; border: 1px solid transparent; border-bottom: none; user-select: none; }
        .tab:hover { background-color: #323639; }
        .tab.active { background-color: #35363a; color: #fff; border-color: #444; }
        .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 10px; }
        
        .close-btn { background: none; border: none; color: #9aa0a6; cursor: pointer; font-size: 16px; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background-color: #5f6368; color: #fff; }
        
        #new-tab-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
        #new-tab-btn:hover { background-color: #3c4043; }

        /* Navigation Bar */
        #nav-bar { display: flex; align-items: center; padding: 8px 15px; background-color: #35363a; gap: 10px; border-bottom: 1px solid #111; }
        .nav-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; }
        .nav-btn:hover { background-color: #4f5256; }
        
        #url-input { flex-grow: 1; background-color: #202124; border: 1px solid #5f6368; color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 14px; outline: none; transition: 0.2s; }
        #url-input:focus { border-color: #8ab4f8; background-color: #171717; }

        /* Content Area */
        #content-area { flex-grow: 1; position: relative; background-color: #fff; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; display: none; }
        iframe.active { display: block; background: #fff; }
        
        /* Start Page (Google Search Engine) */
        #start-page { width: 100%; height: 100%; background-color: #202124; display: none; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; z-index: 10; }
        #start-page.active { display: flex; }
        .search-container { width: 90%; max-width: 700px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .browser-logo { font-size: 40px; font-weight: bold; color: #fff; margin-bottom: 30px; letter-spacing: 2px; }
    </style>

    <!-- Google Custom Search Script (Provided by you) -->
    <script async src="https://cse.google.com/cse.js?cx=1041904591413490c"></script>
</head>
<body>

    <!-- Tabs Container -->
    <div id="tab-bar">
        <div id="tabs-list" style="display: flex; gap: 5px;"></div>
        <button id="new-tab-btn" onclick="createNewTab()">+</button>
    </div>

    <!-- Navigation Bar -->
    <div id="nav-bar">
        <button class="nav-btn" onclick="refreshCurrentTab()" title="Refresh">↻</button>
        <button class="nav-btn" onclick="goHome()" title="Home">🏠</button>
        <input type="text" id="url-input" placeholder="Type URL (e.g. example.com) and press Enter" onkeypress="handleUrlKey(event)">
        <button class="nav-btn" onclick="loadUrl()" title="Go">➔</button>
    </div>

    <!-- Web Content Area -->
    <div id="content-area">
        <!-- Google Search Start Page -->
        <div id="start-page" class="active">
            <div class="browser-logo">Browser Web</div>
            <div class="search-container">
                <div class="gcse-search"></div>
            </div>
        </div>
        <!-- Iframes will be generated here -->
    </div>

    <!-- Application Logic -->
    <script>
        let tabs = [];
        let activeTabId = null;
        let tabCounter = 0;

        // Initialize First Tab on load
        window.onload = () => {
            createNewTab();
        };

        // Create a new Tab
        function createNewTab() {
            tabCounter++;
            const tabId = 'tab-' + tabCounter;
            
            const newTab = {
                id: tabId,
                url: '',
                title: 'New Tab'
            };
            
            tabs.push(newTab);
            
            // Create hidden iframe for this tab
            const iframe = document.createElement('iframe');
            iframe.id = 'iframe-' + tabId;
            document.getElementById('content-area').appendChild(iframe);
            
            switchTab(tabId);
        }

        // Switch to a specific tab
        function switchTab(id) {
            activeTabId = id;
            updateUI();
        }

        // Close a tab
        function closeTab(event, id) {
            event.stopPropagation(); // Prevent switching to tab when clicking close
            
            // Remove iframe from DOM
            const iframe = document.getElementById('iframe-' + id);
            if (iframe) iframe.remove();
            
            // Remove from array
            tabs = tabs.filter(t => t.id !== id);
            
            // If no tabs left, create a new one
            if (tabs.length === 0) {
                createNewTab();
                return;
            }
            
            // If closed tab was active, switch to the last available tab
            if (activeTabId === id) {
                switchTab(tabs[tabs.length - 1].id);
            } else {
                updateUI();
            }
        }

        // Load URL into current tab
        function loadUrl() {
            let inputUrl = document.getElementById('url-input').value.trim();
            if (!inputUrl) return;

            // Auto-add https:// if missing
            if (!inputUrl.startsWith('http://') && !inputUrl.startsWith('https://')) {
                inputUrl = 'https://' + inputUrl;
            }

            // Update state
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) {
                currentTab.url = inputUrl;
                currentTab.title = inputUrl;
                document.getElementById('iframe-' + activeTabId).src = inputUrl;
            }
            updateUI();
        }

        // Handle Enter key in URL bar
        function handleUrlKey(event) {
            if (event.key === 'Enter') {
                loadUrl();
            }
        }

        // Refresh current tab
        function refreshCurrentTab() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab && currentTab.url) {
                const iframe = document.getElementById('iframe-' + activeTabId);
                iframe.src = iframe.src; // Reloads iframe
            }
        }

        // Go to Home (Start Page)
        function goHome() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) {
                currentTab.url = '';
                currentTab.title = 'New Tab';
                document.getElementById('iframe-' + activeTabId).src = 'about:blank';
                document.getElementById('url-input').value = '';
            }
            updateUI();
        }

        // Update entire UI based on state
        function updateUI() {
            const tabsList = document.getElementById('tabs-list');
            tabsList.innerHTML = '';

            // Render Tab Buttons
            tabs.forEach(tab => {
                const tabElement = document.createElement('div');
                tabElement.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                tabElement.onclick = () => switchTab(tab.id);
                
                tabElement.innerHTML = `
                    <span class="tab-title">${tab.title}</span>
                    <button class="close-btn" onclick="closeTab(event, '${tab.id}')">×</button>
                `;
                tabsList.appendChild(tabElement);
            });

            // Handle Iframes and Start Page visibility
            const currentTab = tabs.find(t => t.id === activeTabId);
            const startPage = document.getElementById('start-page');
            const urlInput = document.getElementById('url-input');

            // Hide all iframes first
            document.querySelectorAll('iframe').forEach(frame => frame.classList.remove('active'));

            if (currentTab) {
                if (currentTab.url === '') {
                    // Show Start page (Google Search), hide iframe
                    startPage.classList.add('active');
                    urlInput.value = '';
                } else {
                    // Show specific iframe, hide start page
                    startPage.classList.remove('active');
                    document.getElementById('iframe-' + activeTabId).classList.add('active');
                    urlInput.value = currentTab.url;
                }
            }
        }
    </script>
</body>
</html>
